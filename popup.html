<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WYSIWYG Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #333;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    
    .status-label {
      font-size: 12px;
      color: #666;
    }
    
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 24px;
    }
    
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    
    .toggle-switch input:checked + .toggle-slider {
      background-color: #4CAF50;
    }
    
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }
    
    .section {
      margin-bottom: 12px;
    }
    
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    button {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    
    .btn-primary:hover {
      background: #43a047;
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .btn-danger {
      background: #ffebee;
      color: #c62828;
    }
    
    .btn-danger:hover {
      background: #ffcdd2;
    }
    
    .btn-export {
      background: #e3f2fd;
      color: #1976d2;
    }
    
    .btn-export:hover {
      background: #bbdefb;
    }
    
    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 12px 0;
    }
    
    .info {
      font-size: 11px;
      color: #888;
      text-align: center;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WYSIWYG Page Editor</h1>
  </div>
  
  <div class="status">
    <span class="status-label">Edit Mode</span>
    <label class="toggle-switch">
      <input type="checkbox" id="editModeToggle">
      <span class="toggle-slider"></span>
    </label>
  </div>
  
  <div class="section">
    <div class="section-title">Actions</div>
    <div class="button-group">
      <button class="btn-secondary" id="resetBtn">Reset All Changes</button>
      <button class="btn-danger" id="clearBtn">Clear All</button>
    </div>
  </div>
  
  <div class="divider"></div>
  
  <div class="section">
    <div class="section-title">Export</div>
    <div class="button-group">
      <button class="btn-export" id="exportHtmlBtn">Export as HTML</button>
      <button class="btn-export" id="exportJsonBtn">Export as JSON</button>
    </div>
  </div>
  
  <div class="info">
    Click on elements to edit • Use the toolbar to style
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
